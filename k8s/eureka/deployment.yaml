apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: exam-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      containers:
        - name: eureka-service
          image: johankarl/exam-eureka-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_OPTS
              value: "-Xmx768m -Xms512m"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dmanagement.metrics.enable.system=false"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration"
            - name: EUREKA_URL
              value: http://eureka-service.exam-namespace.svc.cluster.local:8761/eureka
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
