# k8s/ingress.yaml - RECOMMANDÉ
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exam-project-ingress
  annotations:
    # SUPPRIMEZ ou COMMENTEZ cette annotation.
    # L'Ingress doit passer le chemin complet à l'API Gateway.
    # nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          # Pour l'API Gateway : toutes les requêtes commençant par /api
          - path: /api # Laissez ceci comme préfixe pour l'API Gateway
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service # Nom du service de votre API Gateway
                port:
                  number: 8090 # <-- CORRECTION : Passez à 8090 (si c'est bien le port du service API Gateway)
          # Pour le Frontend : toutes les autres requêtes (la racine /)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend # Nom du service de votre Frontend
                port:
                  number: 80 # Port de votre service Frontend
