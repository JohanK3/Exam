apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exam-project-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: exam.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8090
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
