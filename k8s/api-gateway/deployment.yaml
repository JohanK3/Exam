apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: exam-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service # MODIFIÉ : Pour correspondre au nom du service
  template:
    metadata:
      labels:
        app: api-gateway-service # MODIFIÉ : Pour correspondre au nom du service
    spec:
      containers:
        - name: api-gateway-service # Nom du conteneur, peut être identique au service
          image: johankarl/exam-api-gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
            - name: JAVA_TOOL_OPTIONS # AJOUTÉ : Pour contourner le problème Micrometer
              value: "-Dmanagement.metrics.enable.system=false"
          livenessProbe:
            tcpSocket: # MODIFIÉ : Utilisation de tcpSocket
              port: 8090
            initialDelaySeconds: 60 # Délai augmenté pour laisser le temps à Eureka de démarrer
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket: # MODIFIÉ : Utilisation de tcpSocket
              port: 8090
            initialDelaySeconds: 30 # Délai augmenté
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
