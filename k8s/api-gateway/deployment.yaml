apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
      - name: api-gateway
        image: johankarl/exam-api-gateway-service
        ports:
        - containerPort: 8090
        env:
        # Laissez JAVA_OPTS pour le contrôle fin de la JVM si vous le souhaitez,
        # mais alignez les ressources Kubernetes en conséquence.
        # Alternativement, vous pouvez laisser Kubernetes gérer la mémoire en retirant JAVA_OPTS
        # et en augmentant significativement les limites de mémoire K8s.
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-service:8761/eureka"
        - name: JAVA_OPTS
          value: "-Xmx768m -Xms512m" # Augmentez légèrement la mémoire JVM
        resources:
          requests:
            memory: "768Mi" # Minimum 768 MB de mémoire garantie pour le scheduling
            cpu: "500m"   # Minimum 0.5 CPU core garanti
          limits:
            memory: "1024Mi" # Limite le conteneur à 1 GB de mémoire.
                             # Cela devrait être > Xmx de JAVA_OPTS.
            cpu: "1000m"  # Limite à 1 CPU core.
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8090
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5 # Ajoutez un timeout pour éviter des boucles infinies
          failureThreshold: 3 # Ajoutez un seuil avant le redémarrage
        readinessProbe: # Ajoutez une readinessProbe pour une meilleure gestion du trafic
          httpGet:
            path: /actuator/health
            port: 8090
          initialDelaySeconds: 20 # Peut être plus court que liveness
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
