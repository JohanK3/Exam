apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
      - name: api-gateway
        image: johankarl/exam-api-gateway-service:latest # Image from Docker Hub with ':latest' tag
        ports:
        - containerPort: 8090
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-service:8761/eureka"
        - name: JAVA_OPTS
          value: "-Xmx1024m -Xms512m" # Increased JVM memory
        resources:
          requests:
            memory: "1024Mi" # Request at least 1 GB of memory
            cpu: "750m"      # Request at least 0.75 CPU core
          limits:
            memory: "1536Mi" # Limit to 1.5 GB of memory
            cpu: "1500m"     # Limit to 1.5 CPU core
        livenessProbe:
          tcpSocket:         # Using tcpSocket for health check
            port: 8090
          initialDelaySeconds: 120 # Increased initial delay to 2 minutes
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:    # Added and changed to tcpSocket
          tcpSocket:
            port: 8090
          initialDelaySeconds: 90 # Increased initial delay to 1.5 minutes
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
