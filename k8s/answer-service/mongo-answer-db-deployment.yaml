apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-answer-db
  namespace: exam-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-answer-db
  template:
    metadata:
      labels:
        app: mongo-answer-db
    spec:
      containers:
        - name: mongo
          image: mongo:5.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.runCommand({ ping: 1 })"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.runCommand({ ping: 1 })"
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-answer-pvc
