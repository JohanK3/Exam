apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exam-db
  namespace: exam-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exam-db
  template:
    metadata:
      labels:
        app: mysql-exam-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "examdb"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uroot
                - -proot
            initialDelaySeconds: 120 # Augmenté considérablement (2 minutes)
            periodSeconds: 20        # Vérifie moins fréquemment
            timeoutSeconds: 5        # Augmenté pour donner plus de temps à la commande
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uroot
                - -proot
            initialDelaySeconds: 60  # Augmenté (1 minute)
            periodSeconds: 10        # Vérifie moins fréquemment
            timeoutSeconds: 5        # Augmenté
            failureThreshold: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-exam-pvc
