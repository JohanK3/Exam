# k8s/sonarqube/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube # Nom de votre déploiement SonarQube
  labels:
    app: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
      - name: sonarqube
        image: sonarqube:9.9-community # Utilisez une version spécifique pour la stabilité. Vous pouvez ajuster si besoin.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000 # Port par défaut de SonarQube Web
        env:
        - name: SONARQUBE_JDBC_URL
          value: jdbc:postgresql://sonar-db:5432/sonarqube # Pointe vers le Service Kubernetes de la DB SonarQube
        - name: SONARQUBE_JDBC_USERNAME
          value: sonaruser # Utilisateur défini dans sonar-db-deployment.yaml
        - name: SONARQUBE_JDBC_PASSWORD
          value: sonarpass # Mot de passe défini dans sonar-db-deployment.yaml
        - name: SONARQUBE_WEB_JAVA_OPTS # Options JVM pour le processus Web de SonarQube
          value: "-Xmx512m -Xms256m -XX:MaxDirectMemorySize=256m"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m" # 1 CPU
        volumeMounts:
        - name: sonarqube-data-storage
          mountPath: /opt/sonarqube/data # Pour les données persistant de SonarQube
        - name: sonarqube-extensions-storage
          mountPath: /opt/sonarqube/extensions # Pour les plugins et extensions
        livenessProbe: # Sonde de liveness
          httpGet:
            path: /api/system/health # Chemin de la health check SonarQube
            port: 9000
          initialDelaySeconds: 180 # SonarQube peut prendre BEAUCOUP de temps à démarrer
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe: # Sonde de readiness
          httpGet:
            path: /api/system/status # Autre chemin pour la readiness
            port: 9000
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: sonarqube-data-storage
        persistentVolumeClaim:
          claimName: sonarqube-data-pvc # Référence à la PVC pour les données de SonarQube (à créer ensuite)
      - name: sonarqube-extensions-storage
        persistentVolumeClaim:
          claimName: sonarqube-extensions-pvc # Référence à la PVC pour les extensions (à créer ensuite)
