version: '3.8'

services:
  # Service Discovery
  eureka-service:
    build:
      context: backend
      dockerfile: eureka-service/Dockerfile # Chemin corrigé
    image: exam-eureka-service:latest # Ajout d'un nom d'image pour faciliter le tagging/push
    ports:
      - "8761:8761"
    networks:
      - app-network

  # API Gateway
  api-gateway-service:
    build:
      context: backend
      dockerfile: api-gateway-service/Dockerfile # Chemin corrigé
    image: exam-api-gateway-service:latest # Ajout d'un nom d'image
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
    depends_on:
      - eureka-service
    networks:
      - app-network

  # Services métiers avec leurs bases de données
  answer-service:
    build:
      context: backend
      dockerfile: answer-service/Dockerfile # Chemin corrigé
    image: exam-answer-service:latest # Ajout d'un nom d'image
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo-answer-db:27017/answerdb
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
    depends_on:
      - mongo-answer-db
      - eureka-service
    networks:
      - app-network

  mongo-answer-db:
    image: mongo:5.0
    container_name: mongo-answer-db
    volumes:
      - mongo-answer-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  exam-service:
    build:
      context: backend
      dockerfile: exam-service/Dockerfile # Chemin corrigé
    image: exam-exam-service:latest # Ajout d'un nom d'image
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-exam-db:3306/examdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
    depends_on:
      - mysql-exam-db
      - eureka-service
    networks:
      - app-network

  course-service:
    build:
      context: backend
      dockerfile: course-service/Dockerfile # Chemin corrigé
    image: exam-course-service:latest # Ajout d'un nom d'image
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-exam-db:3306/examdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
    depends_on:
      - mysql-exam-db
      - eureka-service
    networks:
      - app-network

  mysql-exam-db:
    image: mysql:8.0
    container_name: mysql-exam-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: examdb
    volumes:
      - mysql-exam-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  user-service:
    build:
      context: backend
      dockerfile: user-service/Dockerfile # Chemin corrigé
    image: exam-user-service:latest # Ajout d'un nom d'image
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user-db:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
    depends_on:
      - postgres-user-db
      - eureka-service
    networks:
      - app-network

  postgres-user-db:
    image: postgres:13
    container_name: postgres-user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "userdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Frontend Angular
  frontend:
    build:
      context: frontend # Chemin corrigé: "frontend" si Dockerfile est dans le sous-dossier frontend
      dockerfile: Dockerfile # C'est juste "Dockerfile" si le contexte est le dossier frontend
    image: exam-frontend:latest # Ajout d'un nom d'image
    ports:
      - "4200:80"
    depends_on:
      - api-gateway-service
    networks:
      - app-network

  # --- Services SonarQube ajoutés ---
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube_app
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar # <--- REMPLACER CE MOT DE PASSE
      - SONAR_WEB_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_SEARCH_JAVAOPTS=-Xmx512m -Xms512m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  sonar-db:
    image: postgres:13
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar # <--- REMPLACER CE MOT DE PASSE
      POSTGRES_DB: sonarqube
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 10s
      timeout: 5s
      retries: 2
  # --- Fin des services SonarQube ---

networks:
  app-network:
    driver: bridge

volumes:
  mongo-answer-data:
  mysql-exam-data:
  postgres-user-data:
  # --- Volumes SonarQube ajoutés ---
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:
  # --- Fin des volumes SonarQube ---